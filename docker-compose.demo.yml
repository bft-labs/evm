      - WALSHIP_REMOTE_URL=${WALSHIP_REMOTE_URL:-http://host.docker.internal:8080/v1/ingest/wal-frames}
      - WALSHIP_AUTH_KEY=${WALSHIP_AUTH_KEY:-5a21c5c5dcf34b1aad1eafff1d0e6653}
