      - DEBUG=0
      - ID=2
      - LOG=${LOG:-evmd.log}
    depends_on:
      setup:
        condition: service_completed_successfully
    command: start --chain-id ${CHAIN_ID:-local-test-1234} --minimum-gas-prices 0atest --json-rpc.enable true --json-rpc.api eth,txpool,personal,net,debug,web3
    ports:
      - "26676-26677:26656-26657"
      - "1319:1317"
      - "8565:8545"
    volumes:
      - ./.testnets:/data:Z
    networks:
      - localnet

  walship2:
    container_name: walship2
    restart: always
    build:
      context: ../cosmos-analyzer-shipper
      dockerfile: Dockerfile
    depends_on:
      - evmdnode2
    volumes:
      - ./.testnets:/data:ro
    environment:
      - WALSHIP_ROOT=/data/node2/evmd
      - WALSHIP_REMOTE_URL=${WALSHIP_REMOTE_URL:-http://host.docker.internal:8080/v1/ingest/wal-frames}
      - WALSHIP_AUTH_KEY=${WALSHIP_AUTH_KEY:-5a21c5c5dcf34b1aad1eafff1d0e6653}
    networks:
      - localnet

  # --------------------------------------------------------------------------
  # EVM Node 3 & Shipper 3
  # --------------------------------------------------------------------------
  evmdnode3:
    container_name: evmdnode3
    build:
      context: ../evm
      dockerfile: contrib/images/evmd-env/Dockerfile
